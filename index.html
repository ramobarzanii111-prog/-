<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری گرەو - کوردستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: rgba(22, 22, 22, 0.95);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #777;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: #d4af37; }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .hidden { display: none !important; }
        h1, h2 { color: #d4af37; margin-bottom: 10px; }
        p { color: #ccc; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://archive.org/download/HassanZirak/HassanZirak.mp3" type="audio/mpeg">
    </audio>

    <div class="box">
        <!-- بەشی 1: نووسینی ژمارە -->
        <div id="stepPhone">
            <h1>یاری گرەو - کوردستان</h1>
            <p>تکایە ژمارەی مۆبایلەکەت بنووسە</p>
            <input type="text" id="phoneInput" placeholder="0750XXXXXXX">
            <button class="btn" onclick="goToCode()">پاشان</button>
        </div>

        <!-- بەشی 2: نووسینی کۆد -->
        <div id="stepCode" class="hidden">
            <h1>پشکنینی کۆد</h1>
            <p>کۆدی نێردراو بنووسە (کۆدەکە: 1234)</p>
            <input type="text" id="codeInput" placeholder="1234">
            <button class="btn" onclick="checkCode()">چوونە ژوورەوە بۆ یاری</button>
        </div>

        <!-- بەشی 3: ناوەوەی یاری -->
        <div id="stepGame" class="hidden">
            <h2>بەخێر هاتیت بۆ یاری</h2>
            <p>سەرکەوتوو بوویت لە چوونەژوورەوە!</p>
            <button class="btn" onclick="alert('یاری دەست پێکرد!')">دەستپێکردنی یاری</button>
        </div>
    </div>

    <script>
        // کارپێکردنی گۆرانی لە یەکەم کلیک
        document.body.addEventListener('click', function() {
            const m = document.getElementById('bgMusic');
            if (m.paused) { m.play().catch(e => {}); }
        }, { once: true });

        function goToCode() {
            const phone = document.getElementById('phoneInput').value;
            if(phone.trim() === "") {
                alert("تکایە ژمارەی مۆبایل بنووسە!");
                return;
            }
            document.getElementById('stepPhone').classList.add('hidden');
            document.getElementById('stepCode').classList.remove('hidden');
        }

        function checkCode() {
            const code = document.getElementById('codeInput').value;
            // لێرەدا کۆدەکە دەکینە 1234 یان هەر شتێکی تر، بەڵام بۆ ئەوەی بێ کێشە بچێتە ژوورەوە ئەگەر هەڵەش بنووسێت یان 1234 بنووسێت دەیباتە ناو یاری
            if(code === "1234" || code.trim() !== "") {
                const music = document.getElementById('bgMusic');
                music.pause();
                
                document.getElementById('stepPhone').classList.add('hidden');
                document.getElementById('stepCode').classList.add('hidden');
                document.getElementById('stepGame').classList.remove('hidden');
            } else {
                alert("تکایە کۆدی 1234 بنووسە");
            }
        }
    </script>
</body>
</html>
