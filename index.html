<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری گرەو - کوردستان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: rgba(22, 22, 22, 0.95);
            border: 2px solid #3498db;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.4);
        }
        h2 { color: #3498db; margin-bottom: 15px; text-shadow: 0 0 8px rgba(52, 152, 219, 0.5); }
        p { color: #ccc; font-size: 14px; margin-bottom: 20px; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2980b9, #3498db, #5dade2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
        }
    </style>
</head>
<body>

    <!-- گۆرانی حەسەن زیرەک -->
    <audio id="bgMusic" loop>
        <source src="https://archive.org/download/HassanZirak/HassanZirak.mp3" type="audio/mpeg">
    </audio>

    <div class="box">
        <h2>بەخێر هاتیت بۆ یاری گرەو</h2>
        <p>🎵 گۆرانی ڕەسەنی کوردی لەگەڵ کردنەوەی ئەپەکە لێ دەدرێت</p>
        <button class="btn" onclick="startGame()">دەستپێکردنی یاری</button>
    </div>

    <script>
        // لێدانی ئۆتۆماتیکی گۆرانی لەگەڵ یەکەم پەنجەنان لەسەر شاشە
        document.body.addEventListener('click', function() {
            const m = document.getElementById('bgMusic');
            if (m.paused) { m.play().catch(e => {}); }
        }, { once: true });

        function startGame() {
            const m = document.getElementById('bgMusic');
            m.pause();
            alert("یاریکردن دەست پێدەکات!");
        }
    </script>
</body>
</html>
