<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری گرەو - کوردستان</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .casino-container {
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            color: #d4af37;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(26, 26, 26, 0.9);
            border: 1px solid #555;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .btn-casino {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            margin-top: 5px;
        }
        .hidden {
            display: none !important;
        }
        .game-screen {
            text-align: center;
        }
        .game-screen h2 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .info-box {
            background: rgba(31, 31, 31, 0.9);
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #f1c40f;
        }
        .logo-area h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .logo-area p, .music-notice {
            color: #ddd;
            font-size: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://archive.org/download/HassanZirak/HassanZirak.mp3" type="audio/mpeg">
    </audio>

    <div class="casino-container">
        <!-- بەشی چوونەژوورەوە -->
        <div id="loginSection">
            <div class="logo-area">
                <h1>🌄 یاری گرەو - کوردستان</h1>
                <p>تکایە ژمارەی مۆبایل یان ئیمێڵەکەت بنووسە</p>
            </div>
            
            <div class="music-notice">🎵 لەگەڵ کردنەوەی ئەپەکە، گۆرانی ڕەسەنی کوردی لێ دەدرێت</div>

            <div id="step1">
                <div class="input-group">
                    <label>ژمارەی مۆبایل یان ئیمێڵ:</label>
                    <input type="text" id="userInput" placeholder="0750XXXXXXX">
                </div>
                <button class="btn-casino" onclick="sendCode()">ناردنی کۆدی پشکنین</button>
            </div>

            <div id="step2" class="hidden">
                <div class="input-group">
                    <label>کۆدی نێردراو بنووسە (کۆدەکە: 1234):</label>
                    <input type="text" id="codeinput" placeholder="1234">
                </div>
                <button class="btn-casino" onclick="verifyCode()">چوونە ژوورەوە</button>
            </div>
        </div>

        <!-- بەشی ناوەوەی یارییەکە -->
        <div id="gameSection" class="game-screen hidden">
            <h2>بەخێر هاتیت بۆ یاری گرەو</h2>
            <div class="info-box">⭐ کوردستان - لانکەی ئارامی و کاتبەسەربردن</div>
            <p style="color: #ddd; margin-bottom: 20px;">سیستەمی یارییەکە ئامادەیە بۆ یاریکردن!</p>
            <button class="btn-casino" onclick="alert('یاریکردن دەست پێدەکات!')">دەستپێکردنی یاری</button>
        </div>
    </div>

    <script>
        document.body.addEventListener('click', function() {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(e => console.log(e));
            }
        }, { once: true });

        function sendCode() {
            const val = document.getElementById('userInput').value;
            if(val.trim() === "") {
                alert("تکایە ژمارەی مۆبایل یان ئیمێڵ بنووسە!");
                return;
            }
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function verifyCode() {
            const code = document.getElementById('codeinput').value;
            if(code === "1234") {
                const music = document.getElementById('bgMusic');
                music.pause();
                
                // لێرەدا بە جوانی بەشی لۆگین دەشارینەوە و یارییەکە نیشان دەدەین
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('gameSection').classList.remove('hidden');
            } else {
                alert("کۆدەکە هەڵەیە! تکایە 1234 بنووسە.");
            }
        }
    </script>
</body>
</html>
